# =============================================================================
# Run C wiring with FSQ instead of VQ, from scratch on full ImageNet-1k @ 256x256,
# ONE node with 4x H100 (torchrun DDP). See dualvae_fsq_imagenet_4gpu.slurm.
#
# Parent: configs/dualvae_imagenet_gan_C.yaml (the run that finished in
#   checkpoints/dualvae/dualvae_20260805-134849_09061b, rFID 0.50).
# Every schedule / data / GAN / optimizer knob below is byte-identical to that run.
# What changes is ONLY the quantizer and what the latent width has to be for it:
#
#   quantizer      vq  -> fsq        fixed scalar grid; no codebook to learn
#   latent_channels 8  -> 4          d == len(fsq_levels) by construction, and 4x32x32
#                                    = 4096 floats matches the SD-VAE latent budget
#   rq_depth       2   -> 1          residual-FSQ on the same grid is a no-op (the
#                                    residual is bounded by half a cell), and capacity
#                                    comes from prod(levels) instead -- which is free
#   sigma2 floor/ceil                retuned for the grid's scale, see below
#
# CAPACITY, STATED PLAINLY: Run C had rq_depth 2 x log2(256) = 16 bits/location on an
# 8-channel latent. This has log2(390,625) = 18.58 on the SAME 8-channel latent -- so the
# quantizer is the only thing that differs from Run C, and it differs in FSQ's favour on
# rate. If it still loses on rFID, that is a statement about scalar-grid vs learned-codebook
# quantization and not about capacity, which is the cleanest form this comparison can take.
#
# WHAT THE LARGE |C| COSTS: the MSM latent head is off the table at this grid. That head
# builds a (B, HW, K) tensor in masked_latent_gmm_loss -- ~212 MB at |C| = 1296 (the
# 2026-08-08 4-channel run), but 64 TB at |C| = 390,625. It is INACTIVE in this config
# (msm_weight unset -> the whole block is skipped, so training is unaffected), but if the
# per-patch mixture is ever wanted as a JOINT distribution over the code map, this arm cannot
# supply it. Use the [6,6,6,6] / 4-channel setting for that line of work.
#
# THE PRIOR. FSQ codes are grid CORNERS, not cluster means, so the residual is no longer
# zero-mean and the prior becomes N(mu_k, sigma_k^2) with BOTH terms EMA-tracked per code
# and per channel (diagonal). mu_k is the term an EMA codebook gets for free by moving
# its codes. Watch Codebook/Mu over Sigma: if it is ~0 the grid happened to land on the
# cluster centres; if it is O(1), mu_k is carrying the structure. In a synthetic check it
# came out ~0.85, and the sigma2 p90/p10 spread was 5.4x (Run C's measured spread was
# 2.65x), so neither statistic looks degenerate going in.
#
# The fitted mixture (pi_k, mu_k, Sigma_k) rides along in the checkpoint as persistent
# buffers -- vq_layer.gmm_params() returns it ready to sample. That is "Stage 1" of a
# mode-coupled flow-matching source, with no EM and no post-hoc fitting pass.
#
# Data: /scratch-shared/mgonzalez1/imagenet_full_256.h5 (train 1,281,167 | val 50,000).
# =============================================================================
model: "dualvae"

### FSQ ###
quantizer: "fsq"
fsq_levels: [5, 5, 5, 5, 5, 5, 5, 5]
                            # d=8, |C| = 5^8 = 390,625, 18.58 bits/location.
                            # L_i=5 respects the paper's L_i >= 5 heuristic. d MUST equal
                            # latent_channels -- FSQ quantizes every channel, there is no
                            # projection anywhere in this config, so the channel count IS d.
                            # THIS LIST'S LENGTH AND latent_channels ARE ONE SETTING, NOT TWO:
                            # changing one without the other raises at construction
                            # ("latent_channels (8) must equal len(fsq_levels) (4)") before a
                            # single batch is read. The 2026-08-08 run used [6,6,6,6] with
                            # latent_channels 4 -- also consistent, at |C| = 1296.

downsample_factor: 8
kl_beta: 0.1           # Run C setting (mixture pressure). Unchanged.
latent_channels: 8     ### FSQ ### held at 8, matching Run C. Latent is 8x32x32 = 8192 floats,
                       # i.e. the SAME latent tensor the VQ arms decode -- so this arm differs
                       # from dualvae_imagenet_gan_C in the QUANTIZER only, not in width.
                       # Must equal len(fsq_levels) above; the two move together.
rq_depth: 1            ### FSQ ### 2 -> 1. Enforced by FSQEmbedding; see header.
cont_dropout_p: 0.0

# Ignored under FSQ (there is no codebook to size, seed, normalize or commit to). Left in
# place because initialize_model reads them unconditionally, and so a diff against the
# parent config shows exactly one quantizer's worth of change.
num_embeddings: 256         # IGNORED: |C| comes from prod(fsq_levels)
commitment_cost: 0.25       # IGNORED: nothing to commit to
l2_normalize_codes: false   # IGNORED
use_ema_codebook: false     # IGNORED: FSQ keeps EMA *statistics* unconditionally, but
                            # never an EMA codebook -- the grid does not move.
initialize_from_data: False ### FSQ ### was True. No k-means seed: the grid is fixed, so
                            # the trainer's rank-0 seed + broadcast is skipped entirely.
ema_decay: 0.99             # still governs the pi_k / mu_k / sigma_k^2 EMAs
ema_eps: 1.0e-5

# --- Perceptual reconstruction objective (unchanged) ---
perceptual_loss: "lpips"
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0

# --- Code-centered prior wiring (unchanged flags, retuned scale) ---
residual_continuous: true
component_prior: true
### FSQ ### sigma2_floor 0.1 -> 1.0e-4, sigma2_ceil 10.0 -> 0.0625.
# MANDATORY, not cosmetic -- this ceiling clamps the per-code variance that feeds the KL, so
# a wrong value quietly distorts the objective rather than erroring.
# THE CEILING IS GRID-DEPENDENT AND MUST BE RECOMPUTED WHENEVER fsq_levels CHANGES:
#   half_width = L // 2, spacing = 1/half_width, |r| <= 1/(2*half_width),
#   max sigma_k^2 = (1/half_width)^2 / 4,  uniform-in-cell = (1/half_width)^2 / 12
#     L=5 (here):  half_width 2 -> spacing 1/2, max 0.0625, uniform 0.0208
#     L=6 or 7:    half_width 3 -> spacing 1/3, max 0.0278, uniform 0.00926
# 0.0278 is the L=6 value, correct for the 2026-08-08 [6,6,6,6] run and TOO LOW here -- it
# would clamp every code whose residual is wider than a 6-level cell, flattening the top of
# the prior on a grid that is coarser, not finer.
# Run C's floor of 0.1 sits above the maximum on either grid: every code would clamp, the
# per-code prior would collapse to a constant, and the run would look perfectly healthy while
# doing it. FSQEmbedding prints a warning if the FLOOR is set too high (it cannot catch a low
# ceiling, which is why the arithmetic is spelled out above).
# The floor is still the anti-collapse valve: without it an encoder can park every vector
# on the cell centres, drive sigma2 -> 0, and squeeze Delta out of the model.
sigma2_floor: 1.0e-4
sigma2_ceil: 0.0625

# --- Adversarial loss (byte-identical to the parent run) ---
use_gan: true
gan_weight: 0.5
gan_start_epoch: 2
gan_d_start_epoch: 0
gan_ramp_epochs: 1
gan_adaptive_weight: true
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

# --- Learning-rate schedule (byte-identical to the parent run) ---
lr: 0.0002
lr_schedule: "cosine"
lr_warmup_epochs: 1
lr_min_ratio: 0.01

do_wandb: true
use_amp: true

# --- Validation FID/KID ---
# Same seed and same val_subset_size as the parent run, so _maybe_subset draws the
# IDENTICAL 5,000 images and the rFID column is comparable across all three arms.
val_fid: true
val_subset_size: 5000
kid_subset_size: 1000
val_fid_device: "cuda"
val_fid_every_n_epochs: 1

dataset_name: "imagenet"
dataset_path: "/scratch-shared/mgonzalez1/imagenet_full_256.h5"

# batch_size 40 held fixed: FSQ is slightly LIGHTER than the parent (rq_depth 1, no
# codebook lookup, 4 latent channels), so 40 stays inside the 83.7/93 GiB the VQ run
# measured. Raising it would be free throughput and a broken experiment -- same batch,
# same effective batch, same optimizer-step count across all three arms.
batch_size: 40
epochs: 25
patience: 15
do_early_stopping: False

checkpoints: "/scratch-shared/mgonzalez1/checkpoints/dualvae_fsq/"
train_ratio: 0.8
val_ratio: 0.2
resize_img: 256
augment: False
device: "cuda"
architecture: "cuda"
wandb_project: "dual_vae"
wandb_entity: "imagine-laboratory-conare"
seed: 42

deterministic: False
cudnn_benchmark: True
num_workers: 12
prefetch_factor: 6
allow_tf32: True
