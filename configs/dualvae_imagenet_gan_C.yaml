# =============================================================================
# Run C + GAN/perceptual, trained FROM SCRATCH on full ImageNet-1k @ 256x256,
# on ONE node with 4x H100 (torchrun DDP). See hybrid_imagenet_4gpu.slurm.
#
# Recipe parent: configs/dualvae_code_prior_gan_C.yaml as actually run in
#   checkpoints/dualvae/dualvae_20260726-230719_5e588d/config_used.yaml
# EVERY modelling hyperparameter below is byte-identical to that run. Only the
# things that MUST change for the new scale were touched, each marked "### SCALE ###":
#   dataset / path / batch_size / epochs / lr / schedule anchors / val cost / workers.
#
# Data: /scratch-shared/mgonzalez1/imagenet_full_256.h5
#   train 1,281,167 images | val 50,000 | JPEG-in-HDF5, already square 256x256, q90.
#   Read by data.datasets.HDF5ImageDataset (map-style, O(1) random access -> works
#   with DistributedSampler).
# =============================================================================
model: "dualvae"

downsample_factor: 8
kl_beta: 0.1           # Run C setting (mixture pressure). D variant uses 0.001.
latent_channels: 8
num_embeddings: 256
l2_normalize_codes: false
initialize_from_data: True  # k-means seed the codebook (rank 0 seeds, result is broadcast)
cont_dropout_p: 0.0

# --- Perceptual reconstruction objective ---
perceptual_loss: "lpips"    # pixel MSE + perceptual_weight * LPIPS
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0   # set <1.0 (e.g. 0.5) if LPIPS memory is tight

# --- EMA codebook (code-centered-prior recipe) ---
# Under DDP the per-batch EMA statistics are all-reduced across ranks before the update
# (models/modules/embedding.py), so the codebook sees the FULL effective batch -- the
# decay below therefore means the same thing it did on 1 GPU.
use_ema_codebook: true
ema_decay: 0.99
ema_eps: 1.0e-5
ema_dead_threshold: 1.0

# --- RQ + GMM wiring (code-centered prior) ---
rq_depth: 2
residual_continuous: true
component_prior: true
sigma2_floor: 0.1
sigma2_ceil: 10.0

# --- Adversarial loss (VQGAN-style) ---
use_gan: true
gan_weight: 0.5
### SCALE ### gan_start_epoch 10 -> 2, gan_ramp_epochs 2 -> 1, and lr_warmup 5 -> 1.
# Those anchors were tuned in EPOCHS on imagenette (9,469 train images). An ImageNet epoch
# is 135x larger, so keeping "10" would delay the adversarial term by ~12.8M images -- more
# samples than the entire 200-epoch imagenette run saw. Re-anchored to preserve the ORIGINAL
# INTENT (let lr warmup finish and the EMA codebook + per-code sigma_k^2 settle first) in
# optimizer STEPS: at the effective batch below, epoch 2 is ~10k steps of recon-only training,
# which is a longer settle than the imagenette run got.
gan_start_epoch: 2
gan_d_start_epoch: 0      # discriminator trains from epoch 0 (real vs fake.detach())
gan_ramp_epochs: 1        # G-term weight ramps 0 -> gan_weight over these epochs
gan_adaptive_weight: true # VQGAN lambda = ||grad recon|| / ||grad g|| at decoder's last layer
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

# --- Learning-rate schedule ---
### SCALE ### lr 1.0e-4 -> 2.0e-4, lr_warmup_epochs 5 -> 1.
# Effective batch grows 40 -> 160 (4x: 40 per GPU x 4 GPUs). SQUARE-ROOT scaling
# (1e-4 * sqrt(4) = 2.0e-4) rather than linear (4e-4): linear scaling is an SGD result and is
# routinely unstable for Adam-trained VQGANs, where too high an lr collapses codebook
# perplexity early. If you would rather not move off the known-good value at all, set this
# back to 1.0e-4 -- it is the single most reversible knob here.
#
# KEEP THIS IN STEP WITH batch_size:  lr = 1.0e-4 * sqrt(batch_size * 4 / 40)
lr: 0.0002
lr_schedule: "cosine"
lr_warmup_epochs: 1
lr_min_ratio: 0.01

do_wandb: true
use_amp: true

# --- Validation FID/KID ---
### SCALE ### val_subset_size added; kid_subset_size 100 -> 1000.
# Full ImageNet val is 50,000 images. Scoring all of them -- through the model AND through
# InceptionV3 for FID/KID -- every epoch would burn a large slice of the job's GPU-hours on
# metrics. A FIXED 5,000-image subset (same images every epoch, seeded) tracks the same curves
# at 1/10th the cost. Raise val_subset_size to 0 for the full split.
val_fid: true
val_subset_size: 5000
kid_subset_size: 1000
val_fid_device: "cuda"
val_fid_every_n_epochs: 1

### SCALE ### dataset_name / dataset_path -> the HDF5 ImageNet.
dataset_name: "imagenet"
dataset_path: "/scratch-shared/mgonzalez1/imagenet_full_256.h5"

### SCALE ### batch_size UNCHANGED at 40 (PER GPU; 40 x 4 = 160 effective), epochs 200 -> 25.
# batch_size: stays at the parent run's 40, MEASURED not guessed. This decoder holds ~2 GB of
# activations per image at 256x256 (512ch at 32/64, 256ch at 128, 128ch at 256, three residual
# blocks per resolution each retaining ~6 tensors for backward), so 40 already fills most of a
# 94 GiB H100 -- 64 OOMed on the first forward. Smoke test at 40, GAN generator term active:
# peak 83.7/93 GiB (90%). The win from 4 GPUs is parallelism, not a bigger per-GPU batch.
# To re-measure after any architecture change:
#   python tools/probe_batch_size.py --config <this file> --batch-sizes 32,40,48
#
# epochs: 200 imagenette epochs = 1.9M sample-presentations. 25 ImageNet epochs = 32M, i.e.
# ~17x MORE optimization than the parent run, and in line with the shorter published VQGAN /
# SD-VAE stage-1 schedules. Measured cost: 1.95 h/epoch => ~49 h on 4 H100s (~195 GPU-hours).
# The cosine schedule is defined over exactly this many epochs, so changing `epochs` changes
# the whole lr curve -- pick it once, before launching, NOT on a restart. Resuming a 25-epoch
# run with epochs: 40 would resume onto a different lr curve than the one it trained under.
batch_size: 40
epochs: 25
patience: 15
do_early_stopping: False

checkpoints: "/scratch-shared/mgonzalez1/checkpoints/dualvae/"
train_ratio: 0.8
val_ratio: 0.2
resize_img: 256
augment: False
device: "cuda"
architecture: "cuda"
wandb_project: "dual_vae"
wandb_entity: "imagine-laboratory-conare"
seed: 42
commitment_cost: 0.25

### SCALE ### deterministic True -> False, cudnn_benchmark False -> True, num_workers 4 -> 12.
# cudnn.benchmark autotunes the conv algorithms once per shape; shapes are fixed here
# (drop_last=True on the train loader), so it is a free speedup that determinism was blocking.
# 12 workers/rank x 4 ranks = 48 of the node's 64 cores decoding JPEGs, leaving headroom for
# the 4 main processes.
deterministic: False
cudnn_benchmark: True
num_workers: 12
prefetch_factor: 6
allow_tf32: True
