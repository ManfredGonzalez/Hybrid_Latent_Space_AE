# =============================================================================
# Run D+MCM  --  D+ (code-centered prior, kl_beta=0.001, LPIPS+GAN) PLUS Masked CODE Modeling.
#
# Self-supervised, AUGMENTATION-FREE alternative to CVI. A small ViT predictor reads the latent
# grid with ~50% of locations HIDDEN and predicts the CODE (soft GMM assignment) of the hidden
# locations from their visible neighbours. This makes the codes context-predictable = semantic
# (the BEiT/iBOT recipe), using YOUR codebook as the tokenizer -- no augmentation, no invariance,
# no collapse shortcut (a constant/mushy prediction scores badly), so no Sinkhorn/me-max needed.
# The reconstruction/GAN path is untouched (FID-safe); the predictor is a pure auxiliary head.
#
# WHAT TO WATCH (wandb): Train/MSM Accuracy should RISE (fraction of hidden patches whose code the
# context predicts correctly) -- that is the signal the codes are becoming semantically coherent.
# Codebook Perplexity should stay healthy (this objective does NOT pressure it toward collapse).
# Evaluate downstream with tools/linear_probe_retrieval.py (bag-of-codes) vs D+.
#
# Requires on the server: `pip install lpips torchmetrics torch-fidelity`.
# =============================================================================
model: "dualvae"

downsample_factor: 8
kl_beta: 0.001
latent_channels: 8
num_embeddings: 256
l2_normalize_codes: false
initialize_from_data: True
cont_dropout_p: 0.0

# --- Perceptual reconstruction objective ---
perceptual_loss: "lpips"
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0

# --- EMA codebook (code-centered-prior recipe) ---
use_ema_codebook: true
ema_decay: 0.99
ema_eps: 1.0e-5
ema_dead_threshold: 1.0

# --- RQ + GMM wiring (code-centered prior) ---
rq_depth: 2
residual_continuous: true
component_prior: true
sigma2_floor: 0.1
sigma2_ceil: 10.0

# --- Masked latent modeling (semantic codes; reconstruction path untouched) ### MSM ###
masked_modeling: true
masked_modeling_type: "code"       # MCM: predict the GMM soft assignment of hidden patches
msm_mask_ratio: 0.5                # fraction of the 32x32 latent locations hidden per step
msm_tau: 0.5                       # teacher soft-assignment temperature
msm_weight: 0.1                    # target FRACTION of recon (balanced); raise while MSM Accuracy climbs
msm_balance: true                  # anchor MSM to a fraction of the sum-reduced recon loss
msm_max_scale: 50.0                # CAP on the effective weight (bounded -> stable, no runaway)
msm_start_epoch: 8                 # ramp start (after the k-means/EMA codebook settles)
msm_ramp_epochs: 5
msm_dim: 256                       # predictor width
msm_depth: 4                       # predictor transformer layers
msm_heads: 8
msm_dropout: 0.0
msm_lr: 0.0001                     # predictor's own AdamW (separate from the model optimizer)
msm_weight_decay: 0.0

# --- Adversarial loss (VQGAN-style) ---
use_gan: true
gan_weight: 0.5
gan_start_epoch: 10
gan_d_start_epoch: 0
gan_ramp_epochs: 2
gan_adaptive_weight: true
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

# --- Learning-rate schedule ---
lr: 0.0001
lr_schedule: "cosine"
lr_warmup_epochs: 5
lr_min_ratio: 0.01

do_wandb: true
use_amp: true

# --- Validation FID/KID ---
val_fid: true
kid_subset_size: 100
val_fid_device: "cuda"
val_fid_every_n_epochs: 1

dataset_name: "imagenette"
batch_size: 40
epochs: 200
patience: 15
checkpoints: "./checkpoints/dualvae/"
train_ratio: 0.8
val_ratio: 0.2
do_early_stopping: False
resize_img: 256
augment: False
device: "cuda"
architecture: "cuda"
dataset_path: "./datasets/imagenette2-320"
wandb_project: "dual_vae"
wandb_entity: "imagine-laboratory-conare"
seed: 42
commitment_cost: 0.25
deterministic: True
cudnn_benchmark: False
num_workers: 4
