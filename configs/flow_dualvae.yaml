# =============================================================================
# Class-conditional latent FLOW MATCHING in the DUALVAE latent space.
#
#   Autoencoder : checkpoints/dualvae/dualvae_20260726-230704_866e33  (Run D + GAN/LPIPS:
#                 code-centered prior, kl_beta = 0.001, rq_depth 2, residual_continuous,
#                 component_prior, C = 8, downsample 8)
#   Generator   : LatentFlowUNet, rectified-flow objective, CFG-capable.
#
# THE COMPARISON: configs/flow_vae.yaml is this file with THREE lines changed --
# ae_checkpoint, checkpoints and run_prefix. Every generator hyperparameter below is
# identical, so any difference in Gen/FID is attributable to the latent space, which is
# the hypothesis under test (hybrid discrete+continuous latents are easier to generate in
# than a vanilla VAE's).
#
# Run:  python main.py --model latent_flow --config ./configs/flow_dualvae.yaml
# =============================================================================
model: "latent_flow"
run_prefix: "flow_dualvae"

# --- Frozen autoencoder providing the latent space ---
# Point at the RUN DIRECTORY: the loader picks final_epoch.pt (last epoch) first, then
# last.pt, then best.pt, and errors listing the directory if none exist. Last-epoch weights
# are preferred because the autoencoders' best.pt is selected on the TRAIN loss, which is not
# a meaningful signal once the GAN is active. Name a specific .pt here to override.
# The architecture flags are read from the config_used.yaml in that directory, so there is
# nothing to keep in sync by hand.
ae_checkpoint: "./checkpoints/dualvae/dualvae_20260726-230704_866e33"
# ae_config: null            # defaults to <ae_checkpoint dir>/config_used.yaml

# --- Latent handling ---
latent_norm: "per_channel"   # standardize latents with train-set stats (see tools/latent_ae.py).
                             # 'global' or 'none' also available; per_channel is the safe default
                             # because the two latent spaces have very different channel scales.
latent_cache: true           # encode the dataset ONCE, then train straight off the cached
                             # latents (the frozen 256px encoder is otherwise the most
                             # expensive part of every step)
latent_cache_dir: "./latent_cache"
latent_sample: false         # cache the posterior MEAN (noise = 0). Set true (with
                             # latent_cache: false) to draw a fresh posterior sample per step,
                             # LDM-style -- slower, slightly more regularized.
flip_augment: true           # also cache the horizontally-mirrored encoding of every image and
                             # pick one at random per step (Imagenette is small; this is a free 2x)
encode_batch_size: 32        # batch size for the one-off encoding pass

# --- Flow matching objective ---
t_sampling: "logit_normal"   # SD3-style timestep density; 'uniform' for the textbook version
logit_normal_mean: 0.0
logit_normal_std: 1.0
cfg_dropout_prob: 0.1        # label -> NULL class rate, enables classifier-free guidance

# --- UNet velocity field ---
unet_base_channels: 128
unet_channel_mults: [1, 2, 2, 2]      # 32 -> 16 -> 8 -> 4 over the 32x32 latent grid
unet_num_res_blocks: 2
unet_attention_resolutions: [16, 8]
unet_num_heads: 4
unet_dropout: 0.1        # mild regularization -- 39.6M params on ~9.5k images

# --- Optimization ---
batch_size: 64
epochs: 2000                 # ~296k steps at batch 64 (~4h on an RTX 4090, longer on older cards).
                             # FIXED BUDGET: the flow trainer has NO early stopping, so every
                             # run completes exactly this many epochs. Change it in BOTH configs
                             # or the comparison stops being controlled (the cosine schedule is
                             # built over this value too).
lr: 0.0001
weight_decay: 0.0
adam_beta2: 0.999
grad_clip: 1.0
lr_schedule: "cosine"
lr_warmup_epochs: 5
lr_min_ratio: 0.05
use_ema: true
ema_decay: 0.9999
use_amp: true
val_repeats: 4               # Monte-Carlo repeats of the held-out flow loss (fixed seed)
save_every_n_epochs: 25      # how often last.pt (the resume point, carries the optimizer) is rewritten
# resume_from: "./checkpoints/flow_dualvae/<run>/last.pt"   # uncomment to continue a preempted job

# --- Sampling / generative evaluation ---
sample_solver: "heun"        # 2nd-order ODE solver (2 network evals per step)
sample_steps: 50
guidance_scale: 2.0
sample_batch_size: 16
sample_seed: 1234
sample_every_n_epochs: 50
sample_grid_per_class: 4
gen_fid: true
gen_fid_n_samples: 2000      # class-balanced generated samples scored against the val reals
gen_fid_n_real: 2000
gen_fid_every_n_epochs: 50  # ~4 min per evaluation; 20 evaluations over the run
gen_fid_device: "cuda"
kid_subset_size: 100

# --- Data (must match what the autoencoder was trained on) ---
dataset_name: "imagenette"
dataset_path: "./datasets/imagenette2-320"
resize_img: 256
val_ratio: 0.2
# Labels come from noisy_imagenette.csv (auto-discovered next to train/ and val/). ~4% of
# imagenette2's images are named ILSVRC2012_val_*.JPEG and carry no class in the filename, so
# the CSV -- not the filename -- is the label source. Set this only if it lives elsewhere.
# labels_csv: "/path/to/noisy_imagenette.csv"
# label_column: "noisy_labels_0"   # clean ground truth; 1/5/25/50 are fastai's noisy variants
num_workers: 4

# --- Bookkeeping ---
checkpoints: "./checkpoints/flow_dualvae/"
do_wandb: true
wandb_project: "latent_flow"
wandb_entity: "imagine-laboratory-conare"
device: "cuda"
seed: 42
deterministic: True
cudnn_benchmark: False
