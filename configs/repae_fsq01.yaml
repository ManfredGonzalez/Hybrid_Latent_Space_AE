# =============================================================================
# REPA-E: end-to-end tuning of the DualVAE-FSQ tokenizer together with a SiT flow model.
# Phase 1 of reports/mmfm_repae_design.pdf. Run with:
#   torchrun --nproc_per_node=4 main.py --config configs/repae_fsq01.yaml --model repae
#
# WHAT THIS RUN ANSWERS. The mode tests (reports/mmfm_mode_tests/results.json) showed our
# latent has no image-level cluster structure: DINOv2 [CLS] modes explain 56% of the variance
# in [CLS] space and ~0% in our latent space, so an MM-FM mixture source would shorten
# transport by ~2% and is not worth building yet. The hypothesis is that aligning the
# tokenizer to DINOv2 features (REPA-E) creates that structure. The decision gate is a re-run
# of the mode tests on the tuned latent, NOT gFID alone.
#
# The mode tracker below runs during this phase but affects nothing in it: it exists so the
# mixture statistics are already available when the gate is reached.
# =============================================================================
model: "repae"
run_prefix: "repae_fsq01"

# --- Tokenizer to tune (run DIRECTORY; the loader reads config_used.yaml beside it) ---
# rFID 0.463. Starting from a trained tokenizer beats from-scratch slightly (REPA-E Tab. 7).
ae_checkpoint: "./checkpoints/dualvae/FSQ_0.1/dualvae_20260811-093454_af2305"

# --- Generative model ---
sit_model: "SiT-B/2"     # 32x32 latent at patch 2 -> 16x16 = 256 tokens, matching DINOv2-B/14
                         # at 224px one-to-one. Move to SiT-L/2 once the pipeline is verified;
                         # REPA-E's gains GREW with model size (29.6% at B, 34.0% at XL).
encoder_depth: 8         # REPA alignment layer, and where the alignment pass stops
projector_dim: 2048
cfg_dropout_prob: 0.1    # label -> NULL rate, enables classifier-free guidance
num_classes: 1000

# --- Representation encoder (frozen; serves BOTH the REPA loss and the mode tracker) ---
repr_encoder: "dinov2_vitb14"
repr_image_size: 224
# Pre-download the weights on a login node -- compute nodes have no internet:
#   python -c "import torch; torch.hub.load('facebookresearch/dinov2','dinov2_vitb14')"

# --- REPA-E coefficients (reference defaults; do not change without a reason) ---
repa_coeff_sit: 0.5      # alignment weight applied to the SiT's own update
repa_coeff_vae: 1.5      # alignment weight applied to the tokenizer's update

# --- Flow objective ---
t_sampling: "uniform"    # REPA-E's setting with v-prediction. Our frozen-AE arms used
                         # logit_normal; whichever is chosen must be held fixed across arms.
logit_normal_mean: 0.0
logit_normal_std: 1.0

# --- Latent normalization (BatchNorm inside the SiT, affine disabled) ---
bn_momentum: 0.1
latent_stats_batches: 40 # one-off pass to warm-start the BN running statistics. The alignment
                         # pass runs in eval mode, so before those converge the tokenizer would
                         # get REPA gradients computed on badly scaled latents.

# --- Image-level modes for Phase 2 (tracked online, no loss, no offline clustering) ---
track_modes: true
num_modes: 4096          # [CLS] clusters well at 1024/4096/8192; 4096 gives ~313 images per
                         # mode for an 8192-dimensional mean (8192 modes gives only ~156).
mode_decay: 0.99         # codebook EMA
mode_dead_threshold_frac: 0.1   # threshold = 0.1 * batch / M. MUST scale with M: at the fixed
                         # VQEmbedding default of 1.0 the measured run thrashed with 304,500
                         # restarts per epoch and usage collapsed to 3-15% of M.
mode_stats_decay: null   # null = exact cumulative averaging for the per-mode latent statistics
mode_var_shrinkage: 10.0
mode_freeze_epoch: 2     # the [CLS] descriptor is frozen, so the partition converges in ~1
                         # epoch; freezing keeps Phase 2's mode definitions stable.

# --- Tokenizer regularization (keeps rFID from degrading under end-to-end training) ---
kl_beta: 0.1             # our code-centered prior, NOT the reference's plain-VAE KL (1e-6).
                         # Deliberate difference; first knob to revisit if rFID degrades.
perceptual_loss: "lpips"
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0
use_gan: true
gan_weight: 0.5
gan_start_epoch: 0       # the tokenizer is already trained, so the critic is useful from
                         # step 0 -- unlike a from-scratch run, which needs a recon-only phase
gan_d_start_epoch: 0
gan_ramp_epochs: 1
gan_adaptive_weight: true
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

# --- Optimization ---
# GLOBAL BATCH = batch_size x world_size x accum_steps. Held at 256 to match the reference
# recipe, so our optimizer-step counts mean what theirs do (5,005 steps/epoch; their reported
# marks of 100k/200k/400k steps are epochs 20/40/80).
#   8 GPUs: batch_size 32, accum_steps 1     -> 32 x 8 x 1 = 256   (train_repae_8gpu.slurm)
#   4 GPUs: batch_size 32, accum_steps 2     -> 32 x 4 x 2 = 256   (train_repae.slurm)
# Lower batch_size and raise accum_steps in step if the memory sweep says 32 does not fit.
accum_steps: 1
batch_size: 32           # PER RANK, not global: prepare_data gives every DDP process its
                         # own DataLoader, so 4 GPUs means 64 images per optimizer step.
                         # MEASURED CONSTRAINT: the standalone tokenizer recipe recorded batch
                         # 40 at 83.7/93 GiB on an H100 for the TOKENIZER ALONE, and this run
                         # adds SiT + DINOv2 + LPIPS + a discriminator. A probe at 64 per rank
                         # died on step 1 at 92.6/93.3 GiB. Set this from probe_repae.slurm's
                         # sweep, not from the reference recipe (which uses a much lighter
                         # SD-VAE and reaches 256 global on 8 GPUs).
# LEARNING RATE. 1e-4 is the reference's value AT A 256 GLOBAL BATCH, which the batch/accum
# settings above hold. If the global batch is ever changed, scale this (sqrt-scaling) and move
# lr and vae_lr together -- and hold them identical across arms, or the comparison stops being
# about the latent space.
lr: 0.0001

# --- Optimization ---
# GLOBAL BATCH = batch_size x world_size x accum_steps. Held at 256 to match the reference
# recipe, so our optimizer-step counts mean what theirs do (5,005 steps/epoch; their reported
# marks of 100k/200k/400k steps are epochs 20/40/80).
#   8 GPUs: batch_size 32, accum_steps 1     -> 32 x 8 x 1 = 256   (train_repae_8gpu.slurm)
#   4 GPUs: batch_size 32, accum_steps 2     -> 32 x 4 x 2 = 256   (train_repae.slurm)
# Lower batch_size and raise accum_steps in step if the memory sweep says 32 does not fit.
accum_steps: 1
batch_size: 32           # PER RANK, not global: prepare_data gives every DDP process its
                         # own DataLoader, so 4 GPUs means 64 images per optimizer step.
                         # MEASURED CONSTRAINT: the standalone tokenizer recipe recorded batch
                         # 40 at 83.7/93 GiB on an H100 for the TOKENIZER ALONE, and this run
                         # adds SiT + DINOv2 + LPIPS + a discriminator. A probe at 64 per rank
                         # died on step 1 at 92.6/93.3 GiB. Set this from probe_repae.slurm's
                         # sweep, not from the reference recipe (which uses a much lighter
                         # SD-VAE and reaches 256 global on 8 GPUs).
# LEARNING RATE AND BATCH. The reference's 1e-4 goes with a 256-image global batch. If the
# memory sweep lands on 64 global (16 per rank x 4), sqrt-scaling gives 1e-4*sqrt(64/256) =
# 5e-5. Left at 1e-4 until the sweep fixes the batch: change both lr and vae_lr together, and
# hold them identical across arms or the comparison stops being about the latent space.
lr: 0.0001               # SiT (AdamW, constant)
vae_lr: 0.0001           # tokenizer
weight_decay: 0.0
adam_beta2: 0.999
grad_clip: 1.0
epochs: 40
ema_decay_sit: 0.9999
use_amp: true
# CHECKPOINT AND SAMPLE RATES, matching the reference so the artefacts line up with their
# reported marks. global_step counts OPTIMIZER steps, so at a 256 global batch:
#   checkpointing_steps 50000 -> step_0050000.pt ... and their 100k/200k/400k marks are
#     step_0100000.pt / step_0200000.pt / step_0400000.pt
#   sampling_steps 10000      -> one sample grid to wandb every 10k steps (their rate)
# save_every_n_epochs is kept as a cheap safety net on top (epoch_NNN.pt, 0-indexed: their
# "20 epochs" is epoch_019.pt). last.pt is written every epoch for --resume auto.
checkpointing_steps: 50000
sampling_steps: 10000
sample_grid_size: 8      # images per grid; a picture, not a metric
sample_steps: 50         # ODE steps for the in-training grid only. The offline evaluation
                         # (generate_repae.py) uses the SDE sampler at 250 steps, as they do.
sample_cfg_scale: 1.5
guidance_low: 0.0
guidance_high: 1.0
save_every_n_epochs: 5
limit_train_batches: 0   # >0 truncates the epoch (smoke tests)
limit_val_batches: 20    # validation is a health check here, not an evaluation protocol;
                         # rFID/gFID have their own tools and their own protocols

# --- Data ---
dataset_name: "imagenet"
dataset_path: "/gpfs/work3/0/prjs2260/imagenet_full_256.h5"
resize_img: 256
val_subset_size: 5000
num_workers: 12
prefetch_factor: 6

# --- Bookkeeping ---
checkpoints: "/gpfs/work3/0/prjs2260/checkpoints/repae_fsq01/"
do_wandb: true
wandb_project: "repae_imagenet"
wandb_entity: "imagine-laboratory-conare"
device: "cuda"
seed: 42
allow_tf32: true
cudnn_benchmark: true
