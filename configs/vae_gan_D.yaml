# =============================================================================
# Vanilla VAE baseline matched to the DUALVAE run
#   checkpoints/dualvae/dualvae_20260726-230704_866e33
# (Run D: code-centered prior, kl_beta = 0.001, LPIPS + GAN).
#
# PURPOSE: the "no discrete branch" control. Every knob the two models share is set
# identically, so the ONLY differences left are the ones that DEFINE the dual approach:
#   - the VQ branch (codebook, commitment, EMA, rq_depth) and its z_vq
#   - residual_continuous / component_prior -- with no codes there is no e_k to center
#     Delta on, so the KL prior here is the plain N(0, I) a vanilla VAE has
#   - the attention block that fuses z_vq + Delta before the decoder
#
# latent_channels: 8 is the load-bearing setting. DUALVAE decodes an 8-channel
# z_combined = z_vq + Delta; the VAE's historical default was a 4-channel posterior,
# i.e. HALF the latent capacity. Matching it here is what makes the rate comparable.
#
# NOTE: compare against Run D on LPIPS / Val/rFID / Val/KID, NOT PSNR/SSIM -- with a
# GAN active the pixel metrics stay flat or dip while perceptual quality improves.
#
# Requires on the server: `pip install lpips torchmetrics torch-fidelity`.
# =============================================================================
model: "vae"

downsample_factor: 8
kl_beta: 0.001              # Run D setting (weak KL -> higher rate, better reconstruction)
latent_channels: 8          # C, matched to DUALVAE's z_combined width (was 4 by default)

# --- Perceptual reconstruction objective (matches Run D) ---
perceptual_loss: "lpips"    # pixel MSE + perceptual_weight * LPIPS
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0   # set <1.0 (e.g. 0.5) if LPIPS memory is tight

# --- Adversarial loss (VQGAN-style; matches Run D exactly) ---
use_gan: true
gan_weight: 0.5
gan_start_epoch: 10       # G-term activates here -- after lr warmup (5). Run D also waits
                          # for its EMA codebook to settle; the VAE has no codebook, but
                          # the epoch is held identical so the schedules line up.
gan_d_start_epoch: 0      # discriminator trains from epoch 0 on real vs fake.detach()
gan_ramp_epochs: 2        # G-term weight ramps 0 -> gan_weight over these epochs
gan_adaptive_weight: true # VQGAN lambda = ||grad recon|| / ||grad g|| at decoder's last layer
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

# --- Learning-rate schedule (matches Run D) ---
lr: 0.0001
lr_schedule: "cosine"
lr_warmup_epochs: 5
lr_min_ratio: 0.01

do_wandb: true
use_amp: true

# --- Validation FID/KID (the metrics that matter with a GAN) ---
val_fid: true
kid_subset_size: 100
val_fid_device: "cuda"
val_fid_every_n_epochs: 1

dataset_name: "imagenette"
batch_size: 40              # matched to the 866e33 run (NOT the 44 of the C configs)
epochs: 200
patience: 15
checkpoints: "./checkpoints/vae/"
train_ratio: 0.8
val_ratio: 0.2
do_early_stopping: False
resize_img: 256
augment: False
device: "cuda"
architecture: "cuda"
dataset_path: "./datasets/imagenette2-320"   # server path; adjust if different
wandb_project: "dual_vae"
wandb_entity: "imagine-laboratory-conare"
seed: 42
deterministic: True
cudnn_benchmark: False
num_workers: 4
