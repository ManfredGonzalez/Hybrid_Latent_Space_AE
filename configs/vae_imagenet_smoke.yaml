# =============================================================================
# SMOKE TEST for configs/vae_imagenet_gan_D.yaml -- NOT a training run.
#
#   sbatch --export=ALL,CONFIG=configs/vae_imagenet_smoke.yaml --time=00:25:00 \
#          vae_imagenet_4gpu.slurm
#
# Identical to the real config except for the truncation block at the bottom. In ~15 minutes
# it exercises every path the ~40-hour run depends on -- and these paths are NEW for the VAE
# trainer (it was single-process, imagenette-only, until the DDP port), so run this once
# before launching the real job:
#   * HDF5 ImageNet loading through HDF5ImageDataset + DistributedSampler
#   * DDP bring-up, gradient sync, per-rank seeding
#   * BOTH GAN phases -- discriminator-only (epoch 0) and the active G-term (epoch >= 1),
#     including the adaptive lambda taken at VAE_Decoder's last conv
#   * FID/KID cross-rank sync in torchmetrics
#   * checkpoint writing from rank 0 with unwrapped (non-"module.") keys, incl. last.pt
#   * the cosine lr schedule stepping
# It also prints PeakVRAM per epoch, which is the number that confirms batch_size 40 fits.
# =============================================================================
model: "vae"

downsample_factor: 8
latent_channels: 8
kl_beta: 0.001

perceptual_loss: "lpips"
perceptual_weight: 1.0
ffl_alpha: 1.0
perceptual_batch_fraction: 1.0

use_gan: true
gan_weight: 0.5
gan_start_epoch: 1        # SMOKE: fire the G-term at epoch 1 so both GAN phases get covered
gan_d_start_epoch: 0
gan_ramp_epochs: 1
gan_adaptive_weight: true
gan_ndf: 64
gan_layers: 3
gan_lr: 0.0001

lr: 0.0002
lr_schedule: "cosine"
lr_warmup_epochs: 1
lr_min_ratio: 0.01

do_wandb: false           # SMOKE: no wandb run for a throwaway job
use_amp: true

val_fid: true
val_subset_size: 512      # SMOKE: tiny val so FID/KID still runs, but in seconds
kid_subset_size: 128
val_fid_device: "cuda"
val_fid_every_n_epochs: 1

dataset_name: "imagenet"
dataset_path: "/scratch-shared/mgonzalez1/imagenet_full_256.h5"

batch_size: 40
patience: 15
do_early_stopping: False

checkpoints: "/scratch-shared/mgonzalez1/checkpoints/vae_smoke/"
train_ratio: 0.8
val_ratio: 0.2
resize_img: 256
augment: False
device: "cuda"
architecture: "cuda"
wandb_project: "dual_vae"
wandb_entity: "imagine-laboratory-conare"
seed: 42

deterministic: False
cudnn_benchmark: True
num_workers: 12
prefetch_factor: 6
allow_tf32: True

# --- SMOKE truncation --------------------------------------------------------------------
# 3 short epochs instead of 25 full ones. 60 steps/rank x 40 x 4 GPUs = 9,600 images/epoch,
# which is also enough to read a real throughput number off the progress bar and confirm the
# VAE baseline fits inside the same --time request as the DualVAE run.
epochs: 3
limit_train_batches: 60
